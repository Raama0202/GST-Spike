# Full production blueprint (Render paid plans). Not auto-applied: in Render,
# New -> Blueprint, then set "Blueprint Path" to render.full-stack.yaml.
#
# API (auto-scaled, gunicorn + uvicorn workers) + Postgres + Key Value (Redis)
# + static admin console + nightly cleanup cron. Images live in Cloudflare R2.
#
# Connection budget: WEB_CONCURRENCY x (DB_POOL_SIZE + DB_MAX_OVERFLOW) x maxInstances
#   = 3 x (4 + 2) x 4 = 72  <  100 connections on basic-* Postgres plans.
# Raise maxInstances only together with a bigger Postgres plan (or PgBouncer).
#
# Variables marked `sync: false` are prompted for in the Render dashboard on first deploy.
# See backend/README.md "Production deploy checklist".

databases:
  - name: gst-expense-db
    plan: basic-1gb
    region: singapore
    databaseName: gst_expenses
    user: gst
    postgresMajorVersion: "16"
    ipAllowList: []          # private network only

services:
  - type: keyvalue
    name: gst-expense-cache
    plan: starter
    region: singapore
    maxmemoryPolicy: volatile-lru   # every key we write has a TTL
    ipAllowList: []

  - type: web
    name: gst-expense-scanner
    runtime: python
    rootDir: backend
    plan: standard
    region: singapore
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python -m app.seed
    startCommand: gunicorn -c gunicorn.conf.py app.main:app
    healthCheckPath: /ready
    scaling:
      minInstances: 2
      maxInstances: 4
      targetCPUPercent: 65
      targetMemoryPercent: 80
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: gst-expense-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gst-expense-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "3"
      - key: DB_POOL_SIZE
        value: "4"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: LOG_JSON
        value: "true"
      - key: CORS_ORIGINS
        sync: false            # e.g. https://gst-admin-console.onrender.com,https://admin.yourdomain.com
      - key: PUBLIC_WEB_URL
        sync: false
      # Cloudflare R2
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # OTP SMS: msg91 | twilio (employee login returns 503 until configured)
      - key: SMS_PROVIDER
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Razorpay (billing returns 503 until all three are set)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BILLING_TAX_PERCENT
        value: "18"
      # Monitoring / AI
      - key: SENTRY_DSN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

  - type: web
    name: gst-admin-console
    runtime: static
    buildCommand: npm ci && npm --workspace @gst-suite/web run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gst-expense-scanner.onrender.com/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://checkout.razorpay.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://gst-expense-scanner.onrender.com https://*.r2.cloudflarestorage.com https://*.razorpay.com;
          connect-src 'self' https://gst-expense-scanner.onrender.com https://*.r2.cloudflarestorage.com https://api.razorpay.com https://lumberjack.razorpay.com;
          frame-src https://api.razorpay.com https://checkout.razorpay.com;
          font-src 'self' data:;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(self "https://checkout.razorpay.com")
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: cron
    name: gst-expense-cleanup
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    schedule: "30 21 * * *"     # 03:00 IST daily
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.cli cleanup
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: gst-expense-db
          property: connectionString
