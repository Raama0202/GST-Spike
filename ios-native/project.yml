# Optional: regenerate GSTExpense.xcodeproj with `xcodegen generate`.
name: GSTExpense
options:
  bundleIdPrefix: com.gstexpenses
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    API_BASE_URL: "https://gst-expense-scanner.onrender.com/v1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      ALLOW_SERVER_OVERRIDE: YES
    Release:
      ALLOW_SERVER_OVERRIDE: NO

targets:
  GSTScanner:
    type: application
    platform: iOS
    sources:
      - Shared
      - EmployeeApp
    settings:
      base:
        PRODUCT_NAME: GSTScanner
        PRODUCT_BUNDLE_IDENTIFIER: com.gstexpenses.gstexpensescanner
        INFOPLIST_FILE: Config/EmployeeInfo.plist
        TARGETED_DEVICE_FAMILY: "1"

  GSTAdmin:
    type: application
    platform: iOS
    sources:
      - Shared
      - AdminApp
    settings:
      base:
        PRODUCT_NAME: GSTAdmin
        PRODUCT_BUNDLE_IDENTIFIER: com.gstexpenses.gstexpenseadmin
        INFOPLIST_FILE: Config/AdminInfo.plist
        TARGETED_DEVICE_FAMILY: "1,2"
