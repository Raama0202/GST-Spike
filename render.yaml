# GST Spike — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# After first deploy, set secrets in the Render dashboard (do not commit them).

services:
  - type: web
    name: gst-spike-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm --workspace @gst-suite/api run build
    startCommand: npm --workspace @gst-suite/api run start
    healthCheckPath: /api/health
    disk:
      name: gst-spike-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: USE_MEMORY_MONGO
        value: "false"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: FAST2SMS_ROUTE
        value: q
      - key: RAZORPAY_PLAN_MONTHLY_PAISE
        value: "99900"
      - key: RAZORPAY_PLAN_YEARLY_PAISE
        value: "999900"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: gst-spike-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm install && npm --workspace @gst-suite/web run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_ASSET_URL
        sync: false
      - key: VITE_ENABLE_DEMO_FALLBACK
        value: "false"
