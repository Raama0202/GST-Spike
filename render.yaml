# Web console (super admin + company admin) as a free Render static site.
#
# Deliberately static-only so a push never creates paid resources. The API,
# Postgres, Redis and cron live in render.full-stack.yaml.
#
# The console calls https://gst-expense-scanner.onrender.com/v1 (fallback in
# web-admin/src/api/client.ts). That API's CORS_ORIGINS must include this
# site's URL, e.g. https://gst-spike-web.onrender.com.

services:
  - type: web
    name: gst-spike-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm ci && npm --workspace @gst-suite/web run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gst-expense-scanner.onrender.com/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://checkout.razorpay.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://gst-expense-scanner.onrender.com https://*.r2.cloudflarestorage.com https://*.razorpay.com;
          connect-src 'self' https://gst-expense-scanner.onrender.com https://*.r2.cloudflarestorage.com https://api.razorpay.com https://lumberjack.razorpay.com;
          frame-src https://api.razorpay.com https://checkout.razorpay.com;
          font-src 'self' data:;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(self "https://checkout.razorpay.com")
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
