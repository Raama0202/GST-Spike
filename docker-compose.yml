# Local full stack: MongoDB + API (gunicorn). `docker compose up --build`
# Production uses MongoDB Atlas instead of the mongo container (see docs/GO_LIVE.md).
services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: ./backend
    command: python -m app.seed
    environment: &api-env
      MONGODB_URI: mongodb://mongo:27017/gst_expenses
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      OTP_DEV_FIXED: ${OTP_DEV_FIXED:-123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080}
      ENV: ${ENV:-dev}
      LOG_JSON: "false"
      WEB_CONCURRENCY: "2"
      STORAGE_BACKEND: gridfs
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build: ./backend
    environment: *api-env
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  mongo_data:
